# What both Xcode projects share: Coincide.xcodeproj (project.yml: the Mac app, its tools and tests, and Coincide
# Remote) and CoincideRemote.xcodeproj (project-remote.yml: Coincide Remote alone, which store-release archives for the
# App Store). Both specs include this file, so both projects build the same iOS app. Paths are relative to this folder.
options:
  bundleIdPrefix: com.apoorvdarshan
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  # The remote protocol, pairing and theme palettes, shared by the Mac app and Coincide Remote on iOS.
  CoincideRemoteKit:
    path: CoincideRemoteKit
  # Coincide Pro and tips on iOS (CoincideRemote/Pro): RevenueCat's purchases-ios, MIT, from its SwiftPM mirror. Only its
  # RevenueCat product is linked, into CoincideRemote alone; the Mac app, its tools and tests never link it.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    exactVersion: 5.100.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targetTemplates:
  # Coincide Remote: the iPhone and iPad app that drives Coincide on a Mac over the local network or Tailscale. Each
  # spec declares the CoincideRemote target from this template.
  CoincideRemote:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideRemote
        excludes:
          - Info.plist
          - StoreKit
      # For Xcode's Run (the scheme's storeKitConfiguration), not the app bundle.
      - path: CoincideRemote/StoreKit
        buildPhase: none
      # Dictation: the Mac's microphone capture and Apple speech recognition, and where the transcript goes in the text.
      - path: Coincide/Voice/Shared
      - path: CoincideKit/Voice/DictationInsertion.swift
      # The bot personality presets, the same file CoincideKit builds, so the phone offers the Mac's presets with
      # their text and localizes their names in its own catalog.
      - path: CoincideKit/Models/BotPersonalityPreset.swift
    dependencies:
      - package: CoincideRemoteKit
      - package: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.remote
        PRODUCT_NAME: CoincideRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        # Signed for devices with the team from Local.xcconfig (see Signing.xcconfig).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_FILE: CoincideRemote/Info.plist
        # iCloud (CloudKit) and push notifications, for lock-screen alerts from the Mac.
        CODE_SIGN_ENTITLEMENTS: CoincideRemote/CoincideRemote.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coincide
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSCameraUsageDescription: Coincide uses the camera to scan the pairing code your Mac shows and to take photos you attach.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Coincide finds and connects to your Macs over the local network.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Coincide attaches the photos you pick to your messages.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Coincide saves the pictures you choose to your photo library.
        # Dictation in the composer, asked for the first time the user taps the microphone.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Coincide listens to the microphone while you dictate a message.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Coincide turns your dictation into text with Apple’s speech recognition on this device.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
schemes:
  CoincideRemote:
    build:
      targets:
        CoincideRemote: all
    run:
      config: Debug
      # Local purchases when run from Xcode, without App Store Connect or a sandbox account.
      storeKitConfiguration: CoincideRemote/StoreKit/Coincide.storekit
    archive:
      config: Release
