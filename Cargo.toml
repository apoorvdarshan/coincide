[workspace]
members = ["crates/coincide-core", "crates/coincide-desktop"]
exclude = ["vendor/gpui-base", "vendor/gpui-pre", "vendor/gpui-webview", "vendor/util_macros", "vendor/perf"]
resolver = "2"

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-webview = { path = "vendor/gpui-webview" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
tempfile = "3"

[profile.dev]
debug = 1

# Preview trust checks hash complete signed bundles repeatedly. Keep the same
# SHA-256 implementation while avoiding its unoptimized ARM software hot loop.
[profile.dev.package.sha2]
opt-level = 3
