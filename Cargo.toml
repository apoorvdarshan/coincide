[workspace]
members = ["crates/coincide-core", "crates/coincide-desktop"]
exclude = ["vendor/gpui-pre", "vendor/util_macros", "vendor/perf"]
resolver = "2"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
tempfile = "3"

[profile.dev]
debug = 1
