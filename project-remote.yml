# Coincide Remote alone, the iOS project archived by store-release.
name: CoincideRemote
include:
  - project-shared.yml
settings:
  base:
    # Coincide Remote's App Store version, released from an ios-v<version> tag.
    MARKETING_VERSION: "0.1.0"
    # store-release reads this and uploads the larger of it and App Store Connect's highest build plus one. The
    # The project uses the committed build number for store-release.
    CURRENT_PROJECT_VERSION: 1
    # The team store-release signs for (ios.team_id in store/store-release.toml). A team set in Local.xcconfig, which
    # the target's Signing.xcconfig includes, takes precedence.
    DEVELOPMENT_TEAM: 23RV7FYH36
targets:
  CoincideRemote:
    templates: [CoincideRemote]
    configFiles:REPLACE: {}
