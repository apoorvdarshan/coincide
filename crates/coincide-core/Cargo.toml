[package]
name = "coincide-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
preview-updater-helper = []

[[bin]]
name = "CoincideRustUpdater"
path = "src/update_helper_main.rs"
required-features = ["preview-updater-helper"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "=1.13.3"
uuid.workspace = true
rusqlite.workspace = true
alacritty_terminal = "0.26"
portable-pty = "0.9"
url = "2"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
base64 = "0.23"
sha2 = "0.11"
ring = "0.17.14"
keyring-core = "=1.0.1"
zeroize = "1"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Coincide Remote: TLS 1.3 WebSocket server (pinned self-signed certificate) and its pairing QR code.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
socket2 = { version = "0.6", features = ["all"] }
qrcodegen = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }
# Avahi advertising for Coincide Remote; already in the graph through the secret store.
zbus = "=5.19.0"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_SystemServices", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "provider_codex_profile_resume_portable"
path = "tests/provider_codex_profile_resume_portable.rs"
harness = false

[[test]]
name = "provider_native_follow_up_portable"
path = "tests/provider_native_follow_up_portable.rs"
harness = false

[[test]]
name = "local_whisper_portable"
path = "tests/local_whisper_portable.rs"
harness = false

[[test]]
name = "github_write_portable"
path = "tests/github_write_portable.rs"
harness = false
