<!doctype html>
<meta charset="utf-8">
<title>Coincide synthetic credential boundary</title>
<h1>Synthetic credential boundary fixture</h1>
<p>No real credentials. No network requests or form submission.</p>
<form id="login">
<label>Username <input id="username" autocomplete="username"></label>
<label>Password <input id="password" type="password" autocomplete="current-password"></label>
<label>Code <input id="code" autocomplete="one-time-code"></label>
<button id="inspect" type="button">Inspect events only</button>
</form>
<pre id="result">No credential events</pre>
<script>
let changes = 0, submissions = 0;
document.querySelector('#login').addEventListener('input', () => changes++);
document.querySelector('#login').addEventListener('change', () => changes++);
document.querySelector('#login').addEventListener('submit', event => { event.preventDefault(); submissions++; });
document.querySelector('#inspect').onclick = () => {
  // Never mirror values into text, console, IPC, URL or storage.
  document.querySelector('#result').textContent = JSON.stringify({changes,submissions});
};
</script>
