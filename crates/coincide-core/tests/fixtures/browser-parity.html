<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Coincide browser parity fixture</title>
<style>body{font:16px sans-serif;margin:24px}iframe{display:block;width:90%;height:250px;margin:16px 0}input,textarea,select,[contenteditable]{display:block;margin:12px 0;padding:8px}#spacer{height:1400px}</style>
<main id="fixture"></main>
<script>
const controls=`<label>Text<input id="text" value="initial" oninput="document.querySelector('#input-result').textContent='Text input event: '+this.value"></label><p id="input-result">No text input event</p>
<label>Read only<input id="readonly" value="unchanged" readonly></label>
<label>Password<input id="password" type="password" value="fixture-private"></label>
<label>One-time code<input id="otp" autocomplete="one-time-code" value="fixture-code"></label>
<label>File<input id="file" type="file"></label>
<label>Multiline<textarea id="multiline">initial</textarea></label>
<label>Choice<select id="choice" onchange="document.querySelector('#choice-result').textContent='Choice change event: '+this.value"><option value="first">First</option><option value="second">Second</option></select></label><p id="choice-result">No choice change event</p>
<div id="editor" contenteditable="true" aria-label="Rich editor"><strong>Initial rich text</strong></div>
<button id="click" onclick="document.querySelector('#result').textContent='Clicked'">Click fixture button</button>
<p id="result">Waiting</p><div id="spacer"></div><p id="bottom">Bottom marker</p>`;
if (location.search.includes('child=1')) {
  document.title='Cross-origin fixture child';
  document.querySelector('#fixture').innerHTML='<h1>Cross-origin child</h1>'+controls;
} else {
  document.querySelector('#fixture').innerHTML='<h1>Top fixture</h1>'+controls;
  const child=document.createElement('iframe');
  child.id='same-origin';child.title='Same-origin child';
  child.srcdoc='<title>Same-origin child</title><h1>Frame marker</h1>'+controls;
  child.addEventListener('load',()=>{
    const nested=child.contentDocument.createElement('iframe');
    nested.id='nested'; nested.title='Nested child';
    nested.srcdoc='<title>Nested child</title><h1>Nested marker</h1><button id="nested-button">Nested button</button>';
    child.contentDocument.body.prepend(nested);
  });
  document.body.append(child);
  const cross=document.createElement('iframe');
  cross.id='cross-origin';cross.title='Cross-origin child';
  const url=new URL(location.href);
  url.hostname=location.hostname==='localhost'?'127.0.0.1':'localhost';url.search='?child=1';
  cross.src=url.href;document.body.append(cross);
  const navigate=document.createElement('button');navigate.id='navigate-child';
  navigate.textContent='Navigate same-origin child';
  navigate.onclick=()=>child.srcdoc='<title>Replacement child</title><h1>Replacement marker</h1>'+controls;
  document.body.prepend(navigate);
}
</script>
</html>
