[package]
name = "coincide-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "coincide-rust"
path = "src/main.rs"

[features]
default = []
native-notifications = ["dep:objc2-user-notifications"]
native-microphone = []
native-computer-use = []
preview-updater-helper = ["coincide-core/preview-updater-helper"]

[dependencies]
coincide-core = { path = "../coincide-core" }
gpui-kit = "=0.9.0"
gpui-webview = "=0.9.0"
wry = { package = "lb-wry", version = "0.53.3" }
anyhow.workspace = true
serde_json.workspace = true
sha2 = "0.11"
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = { version = "=0.13.2", features = ["composite"] }
zbus = "=5.19.0"
atspi = "=0.29.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSArray", "NSNumberFormatter", "NSValue", "NSObject", "NSURL", "NSError", "NSBundle", "block2"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKContentWorld", "WKFrameInfo", "block2"] }
objc2-user-notifications = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotification"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "=1.11.0"

[dev-dependencies]
gpui-pre = { path = "../../vendor/gpui-pre", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.5.0"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Threading", "Win32_System_StationsAndDesktops"] }
