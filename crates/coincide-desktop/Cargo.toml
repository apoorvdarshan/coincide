[package]
name = "coincide-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "coincide-rust"
path = "src/main.rs"

[dependencies]
coincide-core = { path = "../coincide-core" }
gpui-kit = "=0.9.0"
gpui-webview = "=0.9.0"
wry = { package = "lb-wry", version = "0.53.3" }
anyhow.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSArray", "NSNumberFormatter", "NSValue", "NSObject", "NSURL", "NSError", "block2"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKContentWorld", "WKFrameInfo", "block2"] }
