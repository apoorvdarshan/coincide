[package]
name = "coincide-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "coincide-rust"
path = "src/main.rs"

[features]
default = []
native-notifications = ["dep:objc2-user-notifications"]
native-microphone = ["dep:cpal"]
native-computer-use = []
preview-updater-helper = ["coincide-core/preview-updater-helper"]

[dependencies]
zeroize = "1"
base64 = "0.23"
coincide-core = { path = "../coincide-core" }
gpui-kit = "=0.9.0"
gpui-base = "=0.9.0"
gpui-webview = "=0.9.0"
wry = { package = "lb-wry", version = "0.53.3" }
anyhow.workspace = true
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
uuid.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
cpal = { version = "=0.18.2", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = { version = "=0.13.2", features = ["composite", "xinput", "screensaver", "dpms", "res", "xtest"] }
webkit2gtk = { version = "=2.0.1", features = ["v2_40"] }
zbus = "=5.19.0"
atspi = { version = "=0.29.0", default-features = false, features = ["proxies"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSWindow", "NSView", "NSGraphicsContext"] }
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSArray", "NSNumberFormatter", "NSValue", "NSProcessInfo", "NSObject", "NSURL", "NSError", "NSBundle", "block2"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKNavigation", "WKContentWorld", "WKFrameInfo", "WKUIDelegate", "block2"] }
objc2-user-notifications = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotification"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "=1.11.0"

[dev-dependencies]
gpui-base = { version = "=0.9.0", features = ["native-edit-test-support"] }
tempfile.workspace = true
gpui-pre = { path = "../../vendor/gpui-pre", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.5.0"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Graphics_Capture", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
webview2-com = "=0.38.2"
