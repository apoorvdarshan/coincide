[package]
name = "coincide-native-host-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native-computer-use = []
native-notifications = []

[target.'cfg(windows)'.dependencies]
coincide-core = { path = "../coincide-core" }
anyhow.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64 = "0.23"
windows-capture = "=2.0.1"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Graphics_Capture", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
coincide-core = { path = "../coincide-core" }
anyhow.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64 = "0.23"
gtk = "0.18"
x11rb = { version = "=0.13.2", features = ["composite", "xinput", "screensaver", "dpms", "res", "xtest"] }
zbus = "=5.19.0"
atspi = { version = "=0.30.0", default-features = false, features = ["proxies"] }
libc = "0.2"
