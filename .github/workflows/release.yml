# Fail closed: the retired Swift release pipeline cannot publish the Rust app.
# A Rust release pipeline must be validated before this workflow can publish.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unavailable:
    name: Rust release pipeline not configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo '::error::The Swift desktop release pipeline has been retired. A Rust release pipeline is not configured.'
          exit 1
