# OpenSSF Scorecard: checks the repository's security practices, publishes the results to the
# OpenSSF API (for the README badge) and uploads them to code scanning.

name: OpenSSF Scorecard

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly on Saturdays, so the Maintained check stays current.
    - cron: "30 1 * * 6"

# Read-only by default; the job below asks for the two write scopes it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Sign the published results (publish_results).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the results to the OpenSSF REST API, which the Scorecard badge reads.
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
