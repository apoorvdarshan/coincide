name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Check affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      legacy: ${{ steps.scope.outputs.legacy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/* ]] || [[ "$EVENT" == workflow_dispatch ]]; then
            echo rust=true >> "$GITHUB_OUTPUT"
            echo legacy=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT" == pull_request ]]; then
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
            base=HEAD^1
          else
            git fetch --quiet --no-tags --depth=1 origin "$BEFORE"
            base="$BEFORE"
          fi
          git diff --no-renames --name-only -z "$base" HEAD > "$RUNNER_TEMP/changed-files"
          rust=false
          legacy=false
          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            case "$path" in
              crates/*|vendor/*|Cargo.toml|Cargo.lock|.cargo/*|rust-toolchain*|.github/workflows/ci.yml) rust=true ;;
            esac
            case "$path" in
              Coincide/*|CoincideKit/*|CoincideTests/*|CoincideKitTests/*|CoincideAgentHost/*|CoincideAlwaysOn/*|CoincidePowerHelper/*|CoincideCLI/*|CoincideUpdater/*|project.yml|.github/workflows/ci.yml) legacy=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          test "$count" -gt 0
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"

  rust-core:
    name: Rust core tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: required-core-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            required-core-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-
            required-core-${{ runner.os }}-
      - run: cargo test -p coincide-core --locked

  # Preserve the retired desktop's original build and unit test suite as a
  # frozen baseline. This does not test current Rust changes. Remove only when
  # its coverage has been deliberately replaced.
  legacy-swift-baseline:
    name: Retired Swift desktop baseline
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.legacy != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 61452fb00b4213006f8d548bc9b9adee5a67c545
          persist-credentials: false
      - name: Install XcodeGen
        run: |
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/xcodegen.zip" 'https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip'
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate
      - name: Build and run the original macOS unit tests
        run: |
          xcodebuild -project Coincide.xcodeproj -scheme Coincide -destination 'platform=macOS' -skipPackagePluginValidation \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages test \
            -collect-test-diagnostics never

  ios-release-tests:
    # The existing iOS release caller invokes this workflow on its ios-v tag.
    if: startsWith(github.ref, 'refs/tags/ios-v')
    uses: ./.github/workflows/ios-tests.yml
    permissions:
      contents: read

  build-and-test:
    name: Build and test
    needs: [changes, rust-core, legacy-swift-baseline, ios-release-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the relevant checks
        env:
          RUST_RESULT: ${{ needs.rust-core.result }}
          RUST_SCOPE: ${{ needs.changes.outputs.rust }}
          LEGACY_RESULT: ${{ needs.legacy-swift-baseline.result }}
          LEGACY_SCOPE: ${{ needs.changes.outputs.legacy }}
          IOS_RESULT: ${{ needs.ios-release-tests.result }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$RUST_SCOPE" == false ]]; then test "$RUST_RESULT" = skipped; else test "$RUST_RESULT" = success; fi
          if [[ "$LEGACY_SCOPE" == false ]]; then test "$LEGACY_RESULT" = skipped; else test "$LEGACY_RESULT" = success; fi
          if [[ "$REF" == refs/tags/ios-v* ]]; then test "$IOS_RESULT" = success; fi
