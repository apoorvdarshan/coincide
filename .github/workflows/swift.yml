name: Swift
on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', '!Tests/Fuzz/**', 'UITests/**', 'Package.swift', 'Package.resolved', 'script/**', '.github/workflows/swift.yml', 'VERSION', 'docs/*-LICENSE.txt', 'docs/*-NOTICE.txt', 'docs/third-party-notices.json']
  pull_request:
    paths: ['Sources/**', 'Tests/**', '!Tests/Fuzz/**', 'UITests/**', 'Package.swift', 'Package.resolved', 'script/**', '.github/workflows/swift.yml', 'VERSION', 'docs/*-LICENSE.txt', 'docs/*-NOTICE.txt', 'docs/third-party-notices.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep every non-PR run; a shared pending group would replace an earlier main run.
  group: swift-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos_ui: ${{ steps.paths.outputs.macos_ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native UI CI configuration
        run: python3 -m unittest discover -s UITests/macOS -p 'test_*.py' -v
      - name: Select native UI changes
        id: paths
        run: python3 script/macos_ui_ci.py changes
  build:
    runs-on: macos-26
    # Cold compilation has its own existing-sized budget. Listing tests builds
    # every test executable without running or substituting for any test. The
    # packaged app is uploaded here so desktop UI shards run alongside the tests.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-built-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-built-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Compile all Swift test executables without running tests
        run: |
          swift test list > "$RUNNER_TEMP/coincide-swift-test-list.txt"
          test -s "$RUNNER_TEMP/coincide-swift-test-list.txt"
          swift --version > .build/coincide-swift-toolchain.txt
      - name: Package the native app
        run: ./script/build_and_run.sh --build-only
      - name: Verify app signature
        run: codesign --verify --strict dist/Coincide.app
      - name: Verify native resource loading
        run: dist/Coincide.app/Contents/MacOS/Coincide --verify-resources
      - name: Archive the verified SwiftPM app for native UI testing
        run: tar -czf "$RUNNER_TEMP/coincide-native-app.tgz" -C dist Coincide.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coincide-native-app-${{ github.sha }}
          path: ${{ runner.temp }}/coincide-native-app.tgz
          if-no-files-found: error
          retention-days: 1
  test:
    needs: [build]
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-built-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Verify the compiled Swift toolchain matches this runner
        run: |
          swift --version > "$RUNNER_TEMP/coincide-swift-toolchain-current.txt"
          cmp .build/coincide-swift-toolchain.txt "$RUNNER_TEMP/coincide-swift-toolchain-current.txt"
      - name: Begin Swift test diagnostic window
        run: |
          python3 -c 'import os, pathlib, time; pathlib.Path(os.environ["RUNNER_TEMP"], "coincide-swift-tests-started").write_text(str(time.time()))'
      - name: Build and test
        id: swift_tests
        # Process/PTY and deadline regressions share a small hosted runner. Keep
        # every test, while avoiding simultaneous fixture launches starving timers.
        run: |
          swift test --skip-build --no-parallel
      - name: Verify async default closure contexts
        if: always()
        # Inspect actual objects from either SwiftPM build system. A weak async
        # default closure can have incompatible library/client frame records.
        run: python3 script/check_async_default_contexts.py .build
      - name: Collect sanitized Swift test crash stacks
        if: always() && steps.swift_tests.outcome == 'failure'
        continue-on-error: true
        # ReportCrash may finish after the test helper exits. Poll diagnostics
        # only; the failed test suite is never repeated or changed to success.
        run: python3 script/collect_test_crashes.py --since-file "$RUNNER_TEMP/coincide-swift-tests-started" --output "$RUNNER_TEMP/coincide-test-crashes" --wait-seconds 30
      - name: Keep sanitized Swift test crash stacks
        if: always() && steps.swift_tests.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coincide-test-crashes-${{ github.sha }}
          path: ${{ runner.temp }}/coincide-test-crashes/*.json
          if-no-files-found: ignore
          retention-days: 7
  cli-e2e:
    # Drives the packaged app only through the coincide CLI with an offline Codex:
    # send (draft untouched), Markdown/JSON export, and manual context compaction.
    needs: [build]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coincide-native-app-${{ github.sha }}
          path: ${{ runner.temp }}/coincide-native-app
      - name: Extract the verified app
        run: tar -xzf "$RUNNER_TEMP/coincide-native-app/coincide-native-app.tgz" -C "$RUNNER_TEMP/coincide-native-app"
      - name: Run the CLI end-to-end check
        run: python3 UITests/macOS/cli_e2e.py "$RUNNER_TEMP/coincide-native-app/Coincide.app"
  native-ui-shard:
    # Starts with the Swift tests: both need only the build job's verified app/cache.
    needs: [build, changes]
    if: needs.changes.outputs.macos_ui == 'true'
    runs-on: macos-26
    # Each host runs one disjoint selection serially; native windows never compete
    # within a desktop. Preserve all tests and their individual deadlines.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coincide-native-app-${{ github.sha }}
          path: ${{ runner.temp }}/coincide-native-app
      - name: Extract the verified app
        run: tar -xzf "$RUNNER_TEMP/coincide-native-app/coincide-native-app.tgz" -C "$RUNNER_TEMP/coincide-native-app"
      - name: Run native window, menu, keyboard, and persistence tests
        run: ./script/test_macos_ui.sh --ci "$RUNNER_TEMP/coincide-native-app/Coincide.app" --shard-index "${{ matrix.shard }}" --shard-count 4
      - name: Keep native UI screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coincide-native-ui-${{ github.sha }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coincide-desktop-ui-artifacts
          if-no-files-found: error
          retention-days: 14
  native-ui:
    needs: [native-ui-shard, changes]
    if: always() && needs.changes.outputs.macos_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coincide-native-ui-${{ github.sha }}-shard-*
          path: ${{ runner.temp }}/coincide-native-ui-shards
      - name: Require every native UI test exactly once across all shards
        run: python3 script/macos_ui_ci.py verify-shards "$RUNNER_TEMP/coincide-native-ui-shards"
      - name: Enforce every isolated native UI runner outcome
        if: always() && needs.native-ui-shard.result != 'success'
        run: exit 1
