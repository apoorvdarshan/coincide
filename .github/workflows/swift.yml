name: Swift
on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'Package.resolved', 'script/**', '.github/workflows/swift.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'Package.resolved', 'script/**', '.github/workflows/swift.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Build and test
        run: swift test
      - name: Package the native app
        run: ./script/build_and_run.sh --build-only
      - name: Verify app signature
        run: codesign --verify --strict dist/Coincide.app
