name: Rust

on:
  pull_request:
    paths: ['crates/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'rust-toolchain*', 'scripts/test-rust-native-ui-linux.py', 'scripts/native-browser-fixture.py', 'scripts/test-rust-native-browser-dialogs.py', 'scripts/test-rust-native-browser-keys.py', 'scripts/test-rust-native-browser-downloads.py', 'scripts/test-rust-native-browser-uploads.py', 'scripts/test-rust-native-ui-windows.ps1', 'scripts/test-rust-native-secret-store.py', '.github/workflows/rust.yml']
  push:
    branches: [main]
    paths: ['crates/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'rust-toolchain*', 'scripts/test-rust-native-ui-linux.py', 'scripts/native-browser-fixture.py', 'scripts/test-rust-native-browser-dialogs.py', 'scripts/test-rust-native-browser-keys.py', 'scripts/test-rust-native-browser-downloads.py', 'scripts/test-rust-native-browser-uploads.py', 'scripts/test-rust-native-ui-windows.ps1', 'scripts/test-rust-native-secret-store.py', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cone mode includes root manifests; omit unrelated native/store media.
          sparse-checkout: |
            crates
            vendor
            .cargo
            scripts
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
        with:
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/gpui-pre/Cargo.lock', 'vendor/gpui-webview/Cargo.lock', '.cargo/**') }}
          # A lockfile change rebuilds changed dependencies, not the entire graph.
          # The last prefix also migrates existing caches; Cargo checks fingerprints.
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-
            rust-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --all --check
      - run: cargo test -p coincide-core --locked
        id: core_tests
      - name: Diagnose Windows PTY and control tests after core failure
        if: ${{ failure() && runner.os == 'Windows' && steps.core_tests.outcome == 'failure' }}
        run: cargo test -p coincide-core --locked --no-fail-fast --test terminal_windows --test control_windows -- --nocapture
      - name: Test owned Windows upload reader against actual junctions, symlinks and sharing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COINCIDE_SYNTHETIC_UPLOAD_SDK: '1'
        run: |
          cargo test -p coincide-core --lib --locked browser_protocol::upload::windows::sdk_tests -- --ignored --nocapture --test-threads=1 | Tee-Object -FilePath "$env:RUNNER_TEMP/upload-sdk-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/upload-sdk-tests.log" -SimpleMatch 'test result: ok. 6 passed; 0 failed; 0 ignored;')) { throw 'Expected exactly six owned Windows upload SDK tests' }
      - run: cargo clippy -p coincide-core --all-targets --locked -- -D warnings
        if: runner.os != 'Windows'
      - name: Test isolated preview updater helper fixtures
        run: cargo test -p coincide-core --locked --features preview-updater-helper updater_helper
      - name: Lint preview updater helper feature
        if: runner.os != 'Windows'
        run: cargo clippy -p coincide-core --all-targets --locked --features preview-updater-helper -- -D warnings
      - name: Install private Secret Service fixture dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus libglib2.0-bin
      - name: Test one owned synthetic native credential entry
        if: runner.os != 'Windows'
        run: python3 scripts/test-rust-native-secret-store.py
      - name: Test one owned synthetic Windows credential entry
        if: runner.os == 'Windows'
        run: python scripts/test-rust-native-secret-store.py
      - name: Test one owned Windows idle-sleep request
        if: runner.os == 'Windows'
        env:
          COINCIDE_WINDOWS_POWER_CI: owned-native-request
        run: cargo test -p coincide-core --lib --locked platform_host::inhibitor::windows::tests::owned_kernel_round_trip -- --ignored --exact
  desktop:
    name: macOS GPUI build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            crates
            vendor
            .cargo
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/gpui-pre/Cargo.lock', 'vendor/gpui-webview/Cargo.lock', '.cargo/**') }}
          restore-keys: |
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo build -p coincide-desktop --locked
      - name: Test GPUI prepaint accessibility rollback without a native window
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --manifest-path vendor/gpui-pre/Cargo.toml --lib --features test-support prepaint_transaction --locked -- --nocapture
      - name: Test Settings focus routing without a native window
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -o pipefail
          cargo test --manifest-path vendor/gpui-pre/Cargo.toml --lib --features test-support settings_route_focus_ --locked -- --nocapture | tee "$RUNNER_TEMP/settings-route-focus-tests.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/settings-route-focus-tests.log"
      - name: Test actual completed List geometry without a native window
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -o pipefail
          cargo test --manifest-path vendor/gpui-pre/Cargo.toml --lib --features test-support completed_geometry_ --locked -- --nocapture | tee "$RUNNER_TEMP/list-completed-geometry-tests.log"
          grep -F 'test result: ok. 7 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/list-completed-geometry-tests.log"
      - name: Test actual vendored WebView release unit module
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -o pipefail
          cargo test --manifest-path vendor/gpui-webview/Cargo.toml --no-default-features --lib release::tests --config 'patch.crates-io.gpui-pre.path="vendor/gpui-pre"' --locked -- --nocapture | tee "$RUNNER_TEMP/webview-release-own-tests.log"
          grep -F 'test result: ok. 8 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/webview-release-own-tests.log"
      - name: Test synthetic desktop fixtures with notification, microphone and computer-use adapters
        run: cargo test -p coincide-desktop --locked --features native-notifications,native-microphone,native-computer-use
      - name: Test isolated desktop helper transport without native launch
        run: cargo test -p coincide-desktop --locked --features preview-updater-helper updater_helper_transport
      - name: Build synthetic private credential SDK executable
        run: cargo build -p coincide-desktop --example native_credential_sdk --locked
      - name: Verify native private credential channel on a fresh macOS runner
        timeout-minutes: 3
        env:
          COINCIDE_SYNTHETIC_FILL_SDK: '1'
        run: |
          set -o pipefail
          target/debug/examples/native_credential_sdk | tee "$RUNNER_TEMP/native-fill-sdk.log"
          grep -F 'synthetic native fill: PASS' "$RUNNER_TEMP/native-fill-sdk.log"
      - name: Build synthetic native download executable
        if: ${{ !cancelled() }}
        run: cargo build -p coincide-desktop --example native_download_sdk --locked
      - name: Verify exact native downloads on a fresh macOS runner
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          COINCIDE_SYNTHETIC_DOWNLOAD_SDK: '1'
        run: |
          set -o pipefail
          target/debug/examples/native_download_sdk | tee "$RUNNER_TEMP/native-download-sdk.log"
          grep -F 'synthetic native downloads: PASS' "$RUNNER_TEMP/native-download-sdk.log"
      - name: Build synthetic owned upload SDK executable
        if: ${{ !cancelled() }}
        run: cargo build -p coincide-desktop --example native_upload_sdk --locked
      - name: Verify native file attachment and chooser policy on a fresh macOS runner
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          COINCIDE_SYNTHETIC_UPLOAD_SDK: '1'
        run: |
          set -o pipefail
          target/debug/examples/native_upload_sdk 2>&1 | tee "$RUNNER_TEMP/native-upload-sdk.log"
          grep -F 'synthetic native upload: PASS' "$RUNNER_TEMP/native-upload-sdk.log"
      - name: Retain native macOS credential SDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-fill-sdk
          path: |
            ${{ runner.temp }}/native-fill-sdk.log
            ${{ runner.temp }}/native-download-sdk.log
            ${{ runner.temp }}/native-upload-sdk.log
          if-no-files-found: warn
  desktop-windows:
    name: Windows GPUI check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            crates
            vendor
            .cargo
            scripts
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/gpui-pre/Cargo.lock', 'vendor/gpui-webview/Cargo.lock', '.cargo/**') }}
          restore-keys: |
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-
      - name: Test production native host before UI compilation
        shell: pwsh
        run: |
          cargo test -p coincide-native-host-tests --features native-computer-use --locked computer_use -- --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP/native-host-fake-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/native-host-fake-tests.log" -Pattern 'test result: ok. [1-9][0-9]* passed; 0 failed;')) { throw 'Expected nonzero production native host fake tests' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/native-host-fake-tests.log" -SimpleMatch 'constructor_is_inert_and_has_no_native_handles ... ok')) { throw 'Expected inert production Windows constructor' }
      - name: Test exact owned Windows fixture before UI compilation
        shell: pwsh
        run: |
          $env:COINCIDE_CU_NATIVE_CI = 'owned-window-v1'
          try {
            cargo test -p coincide-native-host-tests --features native-computer-use --locked computer_use::windows::native_tests::actual_owned_window_actions_and_capture_drain -- --ignored --exact --nocapture --test-threads=1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-host-owned-window.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Select-String -Path "$env:RUNNER_TEMP/native-host-owned-window.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored;')) { throw 'Expected exactly one unchanged owned-window native host test' }
          } finally { Remove-Item Env:COINCIDE_CU_NATIVE_CI -ErrorAction SilentlyContinue }
      - name: Test native Windows notification payload policy without OS calls
        shell: pwsh
        run: |
          cargo test -p coincide-native-host-tests --features native-computer-use,native-notifications --locked notifications::windows_policy::tests -- --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP/native-host-toast-policy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/native-host-toast-policy.log" -SimpleMatch 'test result: ok. 4 passed; 0 failed; 0 ignored;')) { throw 'Expected exactly four production toast policy tests' }
      - name: Verify actual isolated Windows toast registration delivery and clearing
        shell: pwsh
        run: |
          cargo test -p coincide-native-host-tests --features native-computer-use,native-notifications --locked notifications::windows::tests::actual_owned_notification_registration_post_clear_and_absence -- --ignored --exact --nocapture --test-threads=1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-host-toast-owned.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/native-host-toast-owned.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored;')) { throw 'Expected exactly one actual owned Windows notification test' }
      - run: cargo check -p coincide-desktop --locked
      - name: Check opt-in desktop helper transport
        run: cargo check -p coincide-desktop --locked --features preview-updater-helper
      - name: Test native microphone PCM conversion without opening a device
        shell: pwsh
        run: |
          cargo test -p coincide-desktop --bin coincide-rust microphone::samples::tests --features native-microphone --locked -- --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP/microphone-pcm-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/microphone-pcm-tests.log" -SimpleMatch 'test result: ok. 2 passed; 0 failed; 0 ignored;')) { throw 'Expected exactly two native PCM conversion tests' }
      - name: Test transcript link routing, plan card, changed files and rewind logic
        shell: pwsh
        run: |
          cargo test -p coincide-desktop --bin coincide-rust --features native-microphone --locked -- transcript_links:: composer_plan_card:: turn_changes:: chat_rewind:: --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP/chat-actions-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/chat-actions-tests.log" -SimpleMatch 'test result: ok. 15 passed; 0 failed; 0 ignored;')) { throw 'Expected exactly fifteen chat action logic tests' }
      - name: Test opted-in Computer Use with inert constructors and fake backends only
        shell: pwsh
        run: |
          cargo test -p coincide-desktop --bin coincide-rust computer_use --features native-computer-use --locked -- --nocapture | Tee-Object -FilePath "$env:RUNNER_TEMP/computer-use-fake-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/computer-use-fake-tests.log" -Pattern 'test result: ok. [1-9][0-9]* passed; 0 failed;')) { throw 'Expected nonzero Computer Use fake tests' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/computer-use-fake-tests.log" -SimpleMatch 'constructor_is_inert_and_has_no_native_handles ... ok')) { throw 'Expected Windows native constructor to remain inert' }
      - name: Test actual Computer Use only against an owned synthetic Windows child
        shell: pwsh
        run: |
          $env:COINCIDE_CU_NATIVE_CI = 'owned-window-v1'
          try {
            cargo test -p coincide-desktop --bin coincide-rust --features native-computer-use --locked computer_use::windows::native_tests::actual_owned_window_actions_and_capture_drain -- --ignored --exact --nocapture --test-threads=1 | Tee-Object -FilePath "$env:RUNNER_TEMP/computer-use-owned-window.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Select-String -Path "$env:RUNNER_TEMP/computer-use-owned-window.log" -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored;')) { throw 'Expected exactly one owned-window native Computer Use test' }
          } finally { Remove-Item Env:COINCIDE_CU_NATIVE_CI -ErrorAction SilentlyContinue }
      - name: Build actual Windows native application and owner-aware control CLI
        run: cargo build -p coincide-desktop -p coincide-core --bin coincide-rust --bin coincide-rs --features coincide-desktop/native-microphone,coincide-desktop/native-computer-use,coincide-desktop/native-notifications --locked
      - name: Build synthetic private credential SDK executable
        run: cargo build -p coincide-desktop --example native_credential_sdk --locked
      - name: Verify native private credential channel on a fresh Windows runner
        timeout-minutes: 3
        shell: pwsh
        env:
          COINCIDE_SYNTHETIC_FILL_SDK: '1'
        run: |
          & target/debug/examples/native_credential_sdk.exe | Tee-Object -FilePath "$env:RUNNER_TEMP/native-fill-sdk.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/native-fill-sdk.log" -SimpleMatch 'synthetic native fill: PASS')) { throw 'Expected actual native private fill and callback-owner return' }
      - name: Attempt actual Windows native render input and private Store restart
        shell: pwsh
        run: ./scripts/test-rust-native-ui-windows.ps1 -Binary target/debug/coincide-rust.exe -Client target/debug/coincide-rs.exe -Artifacts "$env:RUNNER_TEMP/windows-native-ui"
      - name: Build synthetic native download executable
        if: ${{ !cancelled() }}
        run: cargo build -p coincide-desktop --example native_download_sdk --locked
      - name: Verify exact native downloads on a fresh Windows runner
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        shell: pwsh
        env:
          COINCIDE_SYNTHETIC_DOWNLOAD_SDK: '1'
        run: |
          & target/debug/examples/native_download_sdk.exe | Tee-Object -FilePath "$env:RUNNER_TEMP/native-download-sdk.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/native-download-sdk.log" -SimpleMatch 'synthetic native downloads: PASS')) { throw 'Expected actual native downloads and callback-owner return' }
      - name: Build synthetic owned upload SDK executable
        if: ${{ !cancelled() }}
        run: cargo build -p coincide-desktop --example native_upload_sdk --locked
      - name: Verify native file attachment through the no-reparse reader on a fresh Windows runner
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        shell: pwsh
        env:
          COINCIDE_SYNTHETIC_UPLOAD_SDK: '1'
        run: |
          & target/debug/examples/native_upload_sdk.exe | Tee-Object -FilePath "$env:RUNNER_TEMP/native-upload-sdk.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP/native-upload-sdk.log" -SimpleMatch 'synthetic native upload: PASS')) { throw 'Expected actual native WebView2 attachment of owned files' }
      - name: Retain actual Windows native UI attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-ui
          path: |
            ${{ runner.temp }}/windows-native-ui
            ${{ runner.temp }}/native-host-toast-*.log
            ${{ runner.temp }}/native-fill-sdk.log
            ${{ runner.temp }}/native-download-sdk.log
            ${{ runner.temp }}/native-upload-sdk.log
          if-no-files-found: warn
  desktop-linux:
    name: Linux GPUI check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            crates
            vendor
            .cargo
            scripts
      - name: Select main Ubuntu archive for native dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("/etc/apt")
          # Hosted images may point .list/.sources at this fixed mirror list.
          paths = [root / "sources.list", root / "apt-mirrors.txt"]
          for suffix in ("*.list", "*.sources"):
              paths.extend(sorted((root / "sources.list.d").glob(suffix)))
          azure = re.compile(rb"(^|[ \t]|^URIs:)(https?://)azure\.archive\.ubuntu\.com(?=/ubuntu(?:/|\s|$))", re.I)
          changed = 0
          for path in paths:
              if not path.is_file():
                  continue
              original = path.read_bytes()
              lines = []
              for line in original.splitlines(keepends=True):
                  entry, marker, comment = line.partition(b"#")
                  lines.append(azure.sub(rb"\1\2archive.ubuntu.com", entry) + marker + comment)
              updated = b"".join(lines)
              if updated != original:
                  path.write_bytes(updated)
                  changed += 1
          print(f"Selected main Ubuntu archive in {changed} existing source files")
          PY
      - name: Update native dependency package indexes
        run: sudo apt-get update
      - name: Install native compile dependencies
        run: sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libegl1-mesa-dev libvulkan-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/gpui-pre/Cargo.lock', 'vendor/gpui-webview/Cargo.lock', '.cargo/**') }}
          restore-keys: |
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-
      - name: Install isolated Linux native host fixture dependencies
        run: sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 at-spi2-core libatk-adaptor
      - name: Compile production Linux native host and run pure guards before UI compilation
        run: |
          set -o pipefail
          cargo test -p coincide-native-host-tests --features native-computer-use --locked linux_cu_ -- --nocapture | tee "$RUNNER_TEMP/linux-native-host-pure-tests.log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/linux-native-host-pure-tests.log"
      - name: Test exact owned X11 fixture before UI compilation
        env:
          COINCIDE_LINUX_CU_CI: private-xvfb-owned-gtk-v1
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' cargo test -p coincide-native-host-tests --features native-computer-use --locked computer_use::linux::native_tests::actual_owned_x11_window_actions_capture_and_drain -- --ignored --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/linux-native-host-owned-tests.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/linux-native-host-owned-tests.log"
      - name: Test exact XWayland refusal before UI compilation
        env:
          COINCIDE_LINUX_CU_CI: private-xvfb-owned-gtk-v1
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' env WAYLAND_DISPLAY=coincide-private-wayland cargo test -p coincide-native-host-tests --features native-computer-use --locked computer_use::linux::native_tests::actual_wayland_refuses_existing_x11_display -- --ignored --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/linux-native-host-wayland-tests.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/linux-native-host-wayland-tests.log"
      - run: cargo check -p coincide-desktop --locked
      - name: Check opt-in desktop helper transport
        run: cargo check -p coincide-desktop --locked --features preview-updater-helper
      - name: Test actual vendored WebView release unit module
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -o pipefail
          cargo test --manifest-path vendor/gpui-webview/Cargo.toml --no-default-features --lib release::tests --config 'patch.crates-io.gpui-pre.path="vendor/gpui-pre"' --locked -- --nocapture | tee "$RUNNER_TEMP/webview-release-own-tests.log"
          grep -F 'test result: ok. 8 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/webview-release-own-tests.log"
      - name: Install native Linux smoke dependencies
        run: sudo apt-get install -y --no-install-recommends xvfb xauth xdotool imagemagick python3-pil tesseract-ocr dbus-x11 at-spi2-core libatk-adaptor mesa-vulkan-drivers vulkan-tools fonts-dejavu-core
      - name: Test Linux Appshots pixels, keys and owned delivery without capture
        run: |
          set -o pipefail
          cargo test -p coincide-desktop --bin coincide-rust appshots_platform::backend::tests --locked -- --nocapture | tee "$RUNNER_TEMP/appshots-linux-tests.log"
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/appshots-linux-tests.log"
          cargo test -p coincide-desktop --bin coincide-rust appshots::tests --locked -- --nocapture | tee "$RUNNER_TEMP/appshots-owner-tests.log"
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/appshots-owner-tests.log"
      - name: Test native microphone PCM conversion without opening a device
        run: |
          set -o pipefail
          cargo test -p coincide-desktop --bin coincide-rust microphone::samples::tests --features native-microphone --locked -- --nocapture | tee "$RUNNER_TEMP/microphone-pcm-tests.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/microphone-pcm-tests.log"
      - name: Test transcript link routing, plan card, changed files and rewind logic
        run: |
          set -o pipefail
          cargo test -p coincide-desktop --bin coincide-rust --features native-microphone --locked -- transcript_links:: composer_plan_card:: turn_changes:: chat_rewind:: --nocapture | tee "$RUNNER_TEMP/chat-actions-tests.log"
          grep -F 'test result: ok. 15 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/chat-actions-tests.log"
      - name: Build actual Linux native application
        run: cargo build -p coincide-desktop --features native-microphone,native-notifications,native-computer-use --locked
      - name: Test actual owned X11 Computer Use on a private desktop
        env:
          COINCIDE_LINUX_CU_CI: private-xvfb-owned-gtk-v1
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' cargo test -p coincide-desktop --bin coincide-rust --features native-microphone,native-notifications,native-computer-use --locked computer_use::linux::native_tests::actual_owned_x11_window_actions_capture_and_drain -- --ignored --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/linux-cu-owned-tests.log"
          python3 -c 'import os,pathlib; text=(pathlib.Path(os.environ["RUNNER_TEMP"])/"linux-cu-owned-tests.log").read_text(); assert "1 passed; 0 failed; 0 ignored;" in text, "Expected the exact owned X11 Computer Use test"'
      - name: Reject XWayland as authority over a Wayland desktop
        env:
          COINCIDE_LINUX_CU_CI: private-xvfb-owned-gtk-v1
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' env WAYLAND_DISPLAY=coincide-private-wayland cargo test -p coincide-desktop --bin coincide-rust --features native-microphone,native-notifications,native-computer-use --locked computer_use::linux::native_tests::actual_wayland_refuses_existing_x11_display -- --ignored --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/linux-cu-wayland-tests.log"
          python3 -c 'import os,pathlib; text=(pathlib.Path(os.environ["RUNNER_TEMP"])/"linux-cu-wayland-tests.log").read_text(); assert "1 passed; 0 failed; 0 ignored;" in text, "Expected the exact Wayland refusal test"'
      - name: Test notifications through a private synthetic desktop bus
        shell: bash
        env:
          COINCIDE_NOTIFICATION_BUS_CI: private-synthetic-server-v1
        run: |
          set -o pipefail
          dbus-run-session -- cargo test -p coincide-desktop --bin coincide-rust --features native-microphone,native-notifications --locked notifications::linux::tests::actual_private_notification_bus_round_trip -- --ignored --exact --nocapture | tee "$RUNNER_TEMP/notification-bus-tests.log"
          python3 -c 'import os,pathlib; text=(pathlib.Path(os.environ["RUNNER_TEMP"])/"notification-bus-tests.log").read_text(); assert "1 passed; 0 failed; 0 ignored;" in text, "Expected the exact private notification bus test"'
      - name: Verify activity on an isolated X11 display and private bus
        env:
          COINCIDE_PRIVATE_ACTIVITY_FIXTURE: '1'
        run: |
          set -o pipefail
          dbus-run-session -- sh -c 'DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" xvfb-run -a -s "-screen 0 1440x1000x24" cargo test -p coincide-desktop --bin coincide-rust --features native-microphone,native-notifications --locked notification_activity::tests::actual_private_x11_activity -- --ignored --exact --nocapture' | tee "$RUNNER_TEMP/notification-activity-tests.log"
          python3 -c 'import os,pathlib; text=(pathlib.Path(os.environ["RUNNER_TEMP"])/"notification-activity-tests.log").read_text(); assert "1 passed; 0 failed; 0 ignored;" in text, "Expected the exact private activity test"'
      - name: Build synthetic private credential SDK executable
        run: cargo build -p coincide-desktop --example native_credential_sdk --locked
      - name: Verify native private credential channel on a fresh Linux runner
        timeout-minutes: 3
        env:
          COINCIDE_SYNTHETIC_FILL_SDK: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
          GPUI_X11_SCALE_FACTOR: '1'
        run: |
          set -o pipefail
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' target/debug/examples/native_credential_sdk | tee "$RUNNER_TEMP/native-fill-sdk.log"
          grep -F 'synthetic native fill: PASS' "$RUNNER_TEMP/native-fill-sdk.log"
      - name: Exercise real X11 UI and private Store restart
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' /usr/bin/python3 scripts/test-rust-native-ui-linux.py --binary target/debug/coincide-rust --artifacts "$RUNNER_TEMP/linux-native-ui"
      - name: Build synthetic native download executable
        if: ${{ !cancelled() }}
        run: cargo build -p coincide-desktop --example native_download_sdk --locked
      - name: Verify exact native downloads on a fresh Linux runner
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          COINCIDE_SYNTHETIC_DOWNLOAD_SDK: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
          GPUI_X11_SCALE_FACTOR: '1'
        run: |
          set -o pipefail
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' target/debug/examples/native_download_sdk | tee "$RUNNER_TEMP/native-download-sdk.log"
          grep -F 'synthetic native downloads: PASS' "$RUNNER_TEMP/native-download-sdk.log"
      - name: Build synthetic owned upload SDK executable
        if: ${{ !cancelled() }}
        run: cargo build -p coincide-desktop --example native_upload_sdk --locked
      - name: Verify native file attachment and chooser policy on a fresh Linux runner
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          COINCIDE_SYNTHETIC_UPLOAD_SDK: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
          GPUI_X11_SCALE_FACTOR: '1'
        run: |
          set -o pipefail
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' target/debug/examples/native_upload_sdk 2>&1 | tee "$RUNNER_TEMP/native-upload-sdk.log"
          grep -F 'synthetic native upload: PASS' "$RUNNER_TEMP/native-upload-sdk.log"
      - name: Retain native Linux UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-native-ui
          path: |
            ${{ runner.temp }}/linux-native-ui
            ${{ runner.temp }}/native-fill-sdk.log
            ${{ runner.temp }}/native-download-sdk.log
            ${{ runner.temp }}/native-upload-sdk.log
          if-no-files-found: warn
