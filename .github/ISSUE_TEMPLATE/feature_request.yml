name: Feature request
description: Suggest an idea or improvement for Coincide
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A clear problem statement helps more than a solution alone.
        Please check [existing issues](https://github.com/apoorvdarshan/coincide/issues) first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I switch from Claude Code to Codex mid-thread, I …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Coincide to do?
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Agents
      description: Which agents does this involve?
      multiple: true
      options:
        - All agents
        - Claude Code
        - Codex
        - Cursor
        - Grok Build
        - OpenCode
        - Antigravity
        - A new agent
        - Not agent-specific
  - type: dropdown
    id: t3code
    attributes:
      label: Does T3 Code have this?
      description: Coincide ports T3 Code, so parity requests are especially easy to scope.
      options:
        - "Yes"
        - "No"
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, screenshots, links or examples from other apps. Leave out secrets and private code.
