version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # webview2-com and the windows crate must move together with lb-wry,
      # which pins webview2-com 0.38: a 0.39 bump alone gives two incompatible
      # ICoreWebView2 types. Lift this when the wry fork moves.
      - dependency-name: webview2-com
        update-types: ["version-update:semver-major"]
      - dependency-name: windows
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Coincide Remote's store-release callers (.github/workflows/ios-release.yml and store-checks.yml) pin one
      # commit with its "# vX.Y.Z" comment, so they move together in a pull request of their own. Other actions keep
      # their own pull requests unless grouped below.
      store-release:
        patterns: ["apoorvdarshan/store-release*"]
      # CodeQL init and analyze must use the same version in each workflow.
      codeql:
        patterns: ["github/codeql-action*"]
    # Those pins run with the App Store Connect key and the signing identity: a new store-release release waits seven
    # days before it is proposed. Security updates never wait.
    cooldown:
      default-days: 7
      include: ["apoorvdarshan/store-release*"]
  - package-ecosystem: nuget
    directory: /windows/App
    schedule:
      interval: weekly
