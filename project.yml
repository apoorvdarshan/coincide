name: Coincide
options:
  bundleIdPrefix: com.apoorvdarshan
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # The Cua Driver release Computer Use bundles, checked against pinned checksums (cached after the first download).
  preGenCommand: scripts/fetch-cua-driver.sh
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.19 and later run a build-tool plug-in that xcodebuild refuses without -skipPackagePluginValidation.
    exactVersion: 1.18.0
  # The remote protocol, pairing and theme palettes, shared by the Mac app and Coincide Remote on iOS.
  CoincideRemoteKit:
    path: CoincideRemoteKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  CoincideKit:
    type: framework
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.kit
        # Kit code states its isolation explicitly (@MainActor on stores, registry, runner and sessions).
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  CoincideUpdater:
    type: tool
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideUpdater
      - path: CoincideKit/Updates
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.updater
        SKIP_INSTALL: YES
  # `coincide`, the command-line tool (CoincideCLI/main.swift), embedded in Coincide.app/Contents/Helpers. It speaks the
  # Remote protocol to the app's control socket, so it links CoincideRemoteKit and nothing else.
  CoincideCLI:
    type: tool
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideCLI
    dependencies:
      - package: CoincideRemoteKit
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_NAME: coincide
        # Not "coincide": its module would overwrite the app's Coincide.swiftmodule on a case-insensitive disk.
        PRODUCT_MODULE_NAME: CoincideCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.cli
        SKIP_INSTALL: YES
  # The lid watcher for Settings › General › Keep Awake (CoincideAlwaysOn/main.swift), embedded in
  # Coincide.app/Contents/Helpers. launchd runs it at login while Keep Awake is on. It shares only CoincideKit/AlwaysOn.
  CoincideAlwaysOn:
    type: tool
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideAlwaysOn
      - path: CoincideKit/AlwaysOn
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_NAME: coincide-always-on
        PRODUCT_MODULE_NAME: CoincideAlwaysOn
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.always-on
        SKIP_INSTALL: YES
  # Keep Awake's battery helper (CoincidePowerHelper/main.swift), a launchd daemon run as root while "Sleep normally on
  # battery" is on: it switches `pmset disablesleep` with the power source. Embedded in Coincide.app/Contents/Helpers.
  CoincidePowerHelper:
    type: tool
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincidePowerHelper
      - path: CoincideKit/AlwaysOn/BatterySleep.swift
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_NAME: coincide-power-helper
        PRODUCT_MODULE_NAME: CoincidePowerHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.power-helper
        SKIP_INSTALL: YES
  # The background agent host (see AgentHostProtocol.swift): a LaunchAgent inside Coincide.app that owns agent
  # sessions so they outlive the app. An app bundle without a Dock icon, so it can post notifications.
  CoincideAgentHost:
    type: application
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideAgentHost
        excludes:
          - LaunchAgents
          - LaunchDaemons
      # For the app icon on its notifications.
      - path: Coincide/Resources/Assets.xcassets
    dependencies:
      # Loaded from Coincide.app's Frameworks folder (see LD_RUNPATH_SEARCH_PATHS), not a copy of its own.
      - target: CoincideKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.agent-host
        PRODUCT_NAME: CoincideAgentHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coincide Agents
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Apoorv Darshan"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
        # Contents/Helpers/CoincideAgentHost.app/Contents/MacOS, four folders below Coincide.app/Contents.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"
  Coincide:
    type: application
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Coincide
        excludes:
          - Info.plist
      # The command-line tool's parsing, client and commands, also built into the app so its tests can run them.
      - path: CoincideCLI/Shared
      # Registered with SMAppService.agent(plistName:), which looks for it here.
      - path: CoincideAgentHost/LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # Keep Awake's battery helper, registered with SMAppService.daemon(plistName:), which looks for it here.
      - path: CoincideAgentHost/LaunchDaemons
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: CoincideKit
      - target: CoincideAgentHost
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: CoincideUpdater
        link: false
        embed: false
      - target: CoincideCLI
        link: false
        embed: false
      - target: CoincideAlwaysOn
        link: false
        embed: false
      - target: CoincidePowerHelper
        link: false
        embed: false
      - package: SwiftTerm
      - package: CoincideRemoteKit
    postBuildScripts:
      - name: Embed update helper
        script: /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/CoincideUpdater" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/CoincideUpdater"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/CoincideUpdater
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/CoincideUpdater
      # Beside the agent host, not in Contents/MacOS, where `coincide` would collide with `Coincide` on a
      # case-insensitive disk.
      - name: Embed command-line tool
        script: |
          /bin/mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/coincide" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/coincide"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/coincide
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/coincide
      # Computer Use's helper (Coincide/ComputerUse), fetched by scripts/fetch-cua-driver.sh. It keeps Cua AI's own
      # Developer ID signature; Coincide starts it as a child, so macOS counts its permissions as Coincide's.
      - name: Embed computer-use helper
        script: |
          /bin/mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          /usr/bin/install -m 755 "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - $(SRCROOT)/Vendor/CuaDriver/cua-driver
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/cua-driver
      # Where com.apoorvdarshan.coincide.always-on.plist's BundleProgram points.
      - name: Embed lid watcher
        script: |
          /bin/mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/coincide-always-on" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/coincide-always-on"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/coincide-always-on
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/coincide-always-on
      # Where com.apoorvdarshan.coincide.power-helper.plist's BundleProgram points.
      - name: Embed battery helper
        script: |
          /bin/mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/coincide-power-helper" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/coincide-power-helper"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/coincide-power-helper
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/coincide-power-helper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide
        PRODUCT_NAME: Coincide
        # Keys the generated Info.plist can't express (App Transport Security for the browser preview).
        INFOPLIST_FILE: Coincide/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coincide
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Apoorv Darshan"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        # Coincide Remote (Settings › General › Remote) listens on the local network.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Coincide lets Coincide Remote on your iPhone or iPad connect over the local network.
        # Settings › Computer Use: the bundled helper runs as Coincide's child, so macOS asks on Coincide's behalf.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Coincide lets the agents you allow in Settings › Computer Use control other apps.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty unless Local.xcconfig sets it, with a provisioning profile that grants what the file asks for:
        # Coincide/CoincideCloudKit.entitlements (the iCloud container) turns on lock-screen alerts for Coincide Remote,
        # Coincide/Passkeys.entitlements turns on passkeys in the browser, CoincideCloudKitPasskeys.entitlements both.
        # See Signing.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(COINCIDE_MAC_ENTITLEMENTS)
        PROVISIONING_PROFILE_SPECIFIER: $(COINCIDE_MAC_PROFILE)
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  # Coincide Remote: the iPhone and iPad app that drives Coincide on a Mac over the local network or Tailscale.
  CoincideRemote:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideRemote
        excludes:
          - Info.plist
    dependencies:
      - package: CoincideRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.remote
        PRODUCT_NAME: CoincideRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        # Signed for devices with the team from Local.xcconfig (see Signing.xcconfig).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_FILE: CoincideRemote/Info.plist
        # iCloud (CloudKit) and push notifications, for lock-screen alerts from the Mac.
        CODE_SIGN_ENTITLEMENTS: CoincideRemote/CoincideRemote.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coincide Remote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSCameraUsageDescription: Coincide Remote uses the camera to scan the pairing code your Mac shows.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Coincide Remote finds and connects to Coincide on your Macs over the local network.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Coincide Remote attaches the photos you pick to your messages.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  CoincideTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideTests
    dependencies:
      - target: Coincide
      # Linked for `import CoincideKit`; the host app already embeds it.
      - target: CoincideKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.apptests
        GENERATE_INFOPLIST_FILE: YES
        # Hosted by the app, whose launch guard creates no windows and never activates under XCTest.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Coincide.app/Contents/MacOS/Coincide"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Points the shared stores at a scratch folder before any test runs (see TestEnvironment.swift).
        INFOPLIST_KEY_NSPrincipalClass: CoincideTests.TestEnvironment
        SWIFT_EMIT_LOC_STRINGS: NO
  CoincideKitTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: CoincideKitTests
    dependencies:
      - target: CoincideKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apoorvdarshan.coincide.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Coincide:
    build:
      targets:
        Coincide: all
        CoincideKit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoincideKitTests
        - CoincideTests
    archive:
      config: Release
  CoincideRemote:
    build:
      targets:
        CoincideRemote: all
    run:
      config: Debug
    archive:
      config: Release
